spring.profiles.default: local
spring.config:
  import:
    - classpath:/rdb.yml
    - classpath:/client.yml
    - classpath:core.yml

server:
  port: ${SERVER_PORT:20000}
  tomcat:
    accesslog:
      enabled: true
      pattern: "%t %r %s %b %Dus"   # %D(처리시간)와 ai_call latencyMs의 간격으로 AI 외 병목을 본다. Tomcat 10+의 %D는 마이크로초

jobdori:
  admin:
    token: ${JOBDORI_ADMIN_TOKEN:}

spring:
  application:
    name: jobdori-api
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    servlet:
      path: /api
  graphql:
    http:
      path: /graphql
    graphiql:
      enabled: false

sentry:
  enabled: true
  dsn: ${SENTRY_DSN:}
  logging:
    enabled: true
    minimum-event-level: warn

---
spring:
  config:
    activate:
      on-profile:
        - local
        - test
  web:
    resources:
      add-mappings: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql

sentry:
  enabled: false
  logging:
    enabled: false

logging:
  level:
    com.jobdori: DEBUG

---
spring:
  config:
    activate:
      on-profile:
        - dev
  web:
    resources:
      add-mappings: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql

logging:
  structured:
    format:
      console: com.jobdori.api.support.logging.DatadogStructuredLogFormatter

---
spring:
  config:
    activate:
      on-profile:
        - prod

logging:
  structured:
    format:
      console: com.jobdori.api.support.logging.DatadogStructuredLogFormatter
