openai:
  api-key: ${OPENAI_API_KEY}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}

notion:
  client-id: ${NOTION_OAUTH_CLIENT_ID}
  client-secret: ${NOTION_OAUTH_CLIENT_SECRET}
  api-version: ${NOTION_API_VERSION:2026-03-11}

discord:
  statistics:
    webhook-url: ${DISCORD_STATISTICS_WEBHOOK_URL:}
  error-notification:
    enabled: ${DISCORD_ERROR_NOTIFICATION_ENABLED:false}
    webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}

---
spring.config:
  activate:
    on-profile:
      - local
      - test

openai:
  api-key: ${OPENAI_API_KEY:dummy}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:dummy-google-client-id}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:dummy-google-client-secret}

notion:
  client-id: ${NOTION_OAUTH_CLIENT_ID:dummy-notion-client-id}
  client-secret: ${NOTION_OAUTH_CLIENT_SECRET:dummy-notion-client-secret}
  api-version: ${NOTION_API_VERSION:2026-03-11}
